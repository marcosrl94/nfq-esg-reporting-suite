<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>GEShop logo — inverted lockup for dark backgrounds</title>
  <desc>GEShop wordmark with naked leaf-arrow mark, light text on dark green. For use on dark backgrounds.</desc>
  <rect x="0" y="0" width="480" height="140" rx="14" fill="#0A2E1F"/>
  <g transform="translate(30, 20)">
    <path d="M 35 90 C 35 60, 60 35, 90 35 C 92 70, 70 92, 35 90 Z" fill="#34D399"/>
    <line x1="35" y1="90" x2="90" y2="35" stroke="#FAFAF7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="90" y1="35" x2="78" y2="35" stroke="#FAFAF7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="90" y1="35" x2="90" y2="47" stroke="#FAFAF7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="128" y="68" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="500" fill="#FAFAF7" letter-spacing="-1.5">GEShop</text>
    <text x="131" y="96" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#34D399" letter-spacing="3.5">GREEN  STRATEGIC  VALUE</text>
  </g>
</svg>
